<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .grid-line { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4 4; }
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 22px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 500; fill: #94a3b8; }
      .lane-box { fill: #0f172a; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .lane-title { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 700; fill: #38bdf8; letter-spacing: 0.08em; }
      .card-pg { fill: #0f2942; stroke: #38bdf8; stroke-width: 1.8; rx: 10; }
      .card-neo { fill: #0c2e27; stroke: #34d399; stroke-width: 1.8; rx: 10; }
      .card-py { fill: #1e1b4b; stroke: #818cf8; stroke-width: 1.8; rx: 10; }
      .card-mcp { fill: #2e1065; stroke: #c084fc; stroke-width: 1.8; rx: 10; }
      .card-warn { fill: #3b1c0c; stroke: #fb923c; stroke-width: 1.8; stroke-dasharray: 5 3; rx: 10; }
      .card-legacy { fill: #27171c; stroke: #f87171; stroke-width: 1.5; stroke-dasharray: 6 4; rx: 10; }
      .card-neutral { fill: #1e293b; stroke: #64748b; stroke-width: 1.5; rx: 10; }
      .node-title { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 700; fill: #f8fafc; }
      .node-code { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; font-weight: 500; fill: #93c5fd; }
      .node-desc { font-family: 'Inter', sans-serif; font-size: 11.5px; font-weight: 400; fill: #cbd5e1; }
      .badge-text { font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 700; fill: #0f172a; }
      .edge-solid { stroke: #38bdf8; stroke-width: 2; fill: none; }
      .edge-neo { stroke: #34d399; stroke-width: 2; fill: none; }
      .edge-mcp { stroke: #c084fc; stroke-width: 2; fill: none; }
      .edge-async { stroke: #fbbf24; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
      .edge-legacy { stroke: #f87171; stroke-width: 1.6; stroke-dasharray: 4 4; fill: none; }
      .edge-label { font-family: 'Inter', sans-serif; font-size: 10.5px; font-weight: 600; fill: #e2e8f0; }
      .edge-label-bg { fill: #0f172a; stroke: #334155; stroke-width: 1; rx: 4; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
  </defs>

  <rect width="1200" height="750" class="bg"/>

  <!-- Header -->
  <text x="30" y="42" class="title">Neurons Backend Layered Architecture — AS-IS (Python 메인 패키지 + 구 Java 레이어 병존)</text>
  <text x="30" y="66" class="subtitle">pureliture/neurons · worker/lib/agent_knowledge/ Module Dependency &amp; Port/Adapter Boundaries (ADR-0002 &amp; ADR-0005)</text>

  <!-- LAYER 1: INTERFACE / TRANSPORT LAYER -->
  <rect x="30" y="95" width="815" height="130" class="lane-box"/>
  <text x="46" y="118" class="lane-title">LAYER 1 · INTERFACE &amp; INGRESS TRANSPORT (worker/lib/agent_knowledge/)</text>

  <rect x="46" y="132" width="250" height="80" class="card-mcp"/>
  <text x="60" y="154" class="node-title">MCP Protocol Server</text>
  <text x="60" y="172" class="node-code">mcp_server.py · mcp_http_server.py</text>
  <text x="60" y="192" class="node-desc">JSON-RPC stdio &amp; HTTP/SSE 엔트리포인트</text>

  <rect x="312" y="132" width="255" height="80" class="card-mcp"/>
  <text x="326" y="154" class="node-title">MCP Tool Handlers (13+ Tools)</text>
  <text x="326" y="172" class="node-code">mcp_tools.py</text>
  <text x="326" y="192" class="node-desc">brain.query, brain_context_resolve 등</text>

  <rect x="583" y="132" width="246" height="80" class="card-neutral"/>
  <text x="597" y="154" class="node-title">Ingress Queue Consumer</text>
  <text x="597" y="172" class="node-code">rag_ingress/ · transcript_ingest.py</text>
  <text x="597" y="192" class="node-desc">NATS / CLI 세션 트랜스크립트 수신</text>

  <!-- LAYER 2: APPLICATION &amp; ORCHESTRATION SERVICES -->
  <rect x="30" y="245" width="815" height="150" class="lane-box"/>
  <text x="46" y="268" class="lane-title">LAYER 2 · APPLICATION &amp; ORCHESTRATION SERVICES (session_memory/)</text>

  <rect x="46" y="282" width="250" height="98" class="card-py"/>
  <text x="60" y="304" class="node-title">Brain Steward Authority</text>
  <text x="60" y="322" class="node-code">session_memory/brain_steward.py</text>
  <text x="60" y="342" class="node-desc">메모리 카드 생명주기, 승격(Promotion),</text>
  <text x="60" y="358" class="node-desc">페르소나 체크, 코퍼스 상태 통합 관장</text>

  <rect x="312" y="282" width="255" height="98" class="card-py"/>
  <text x="326" y="304" class="node-title">LLM Brain Read Service</text>
  <text x="326" y="322" class="node-code">session_memory/llm_brain_service.py</text>
  <text x="326" y="342" class="node-desc">질의 의도 분류, 드리프트 설명,</text>
  <text x="326" y="358" class="node-desc">인시던트·증거 조합 파이프라인 조율</text>

  <rect x="583" y="282" width="246" height="98" class="card-py"/>
  <text x="597" y="304" class="node-title">Session Mining Pipeline</text>
  <text x="597" y="322" class="node-code">memory_miner.py · llm_brain_miner.py</text>
  <text x="597" y="342" class="node-desc">transcript_chunking.py + extraction_llm.py</text>
  <text x="597" y="358" class="node-desc">대화에서 구조화된 MemoryCard 추출</text>

  <!-- LAYER 3: DOMAIN &amp; RESOLUTION ENGINE -->
  <rect x="30" y="415" width="815" height="140" class="lane-box"/>
  <text x="46" y="438" class="lane-title">LAYER 3 · DOMAIN MODELS &amp; HYBRID GRAPH ENGINE (llm_brain_core/)</text>

  <rect x="46" y="452" width="250" height="90" class="card-py"/>
  <text x="60" y="474" class="node-title">Domain Entities &amp; Cards</text>
  <text x="60" y="492" class="node-code">memory_card.py · models</text>
  <text x="60" y="512" class="node-desc">MemoryCard, Episode, Incident, Drift,</text>
  <text x="60" y="528" class="node-desc">PersonaRule, EvidenceEnvelope 도메인 모델</text>

  <rect x="312" y="452" width="255" height="90" class="card-py"/>
  <text x="326" y="474" class="node-title">Graph-First Resolver</text>
  <text x="326" y="492" class="node-code">llm_brain_core/graph_first_resolver.py</text>
  <text x="326" y="512" class="node-desc">엔티티 시드 기반 멀티홉 탐색 후</text>
  <text x="326" y="528" class="node-desc">pgvector 유사도 결과와 하이브리드 결합</text>

  <rect x="583" y="452" width="246" height="90" class="card-py"/>
  <text x="597" y="474" class="node-title">Hybrid Graph &amp; Adapter</text>
  <text x="597" y="492" class="node-code">hybrid_graph.py · graphiti_adapter.py</text>
  <text x="597" y="512" class="node-desc">도메인 객체 ↔ Graphiti 노드/엣지 변환</text>
  <text x="597" y="528" class="node-desc">및 서브그래프 컨텍스트 빌딩</text>

  <!-- LAYER 4: STORAGE ADAPTERS &amp; INFRASTRUCTURE -->
  <rect x="30" y="575" width="815" height="145" class="lane-box"/>
  <text x="46" y="598" class="lane-title">LAYER 4 · STORAGE ADAPTERS &amp; INFRASTRUCTURE (postgres_store/ &amp; llm_brain_core/)</text>

  <rect x="46" y="612" width="250" height="92" class="card-pg"/>
  <text x="60" y="634" class="node-title">PostgreSQL + pgvector Store</text>
  <text x="60" y="652" class="node-code">postgres_store/pgvector_store.py</text>
  <text x="60" y="672" class="node-desc">psycopg3 풀, HNSW 벡터 검색(&lt;=&gt;),</text>
  <text x="60" y="688" class="node-desc">Steward 카드 및 원본 트랜스크립트 CRUD</text>

  <rect x="312" y="612" width="255" height="92" class="card-pg"/>
  <text x="326" y="634" class="node-title">Outbox &amp; Graph Replay Worker</text>
  <text x="326" y="652" class="node-code">outbox_worker.py · graph_replay.py</text>
  <text x="326" y="672" class="node-desc">트랜잭셔널 아웃박스 폴링 및</text>
  <text x="326" y="688" class="node-desc">Neo4j 지식 그래프 재구축/동기화</text>

  <rect x="583" y="612" width="246" height="92" class="card-neo"/>
  <text x="597" y="634" class="node-title">Graphiti Neo4j Backend</text>
  <text x="597" y="652" class="node-code">llm_brain_core/graphiti_backend.py</text>
  <text x="597" y="672" class="node-desc">from graphiti_core import Graphiti</text>
  <text x="597" y="688" class="node-desc">Neo4j Bolt 드라이버 연결 및 Cypher 질의</text>

  <!-- Vertical Dependency Arrows -->
  <path d="M 171 212 L 171 282" class="edge-mcp" marker-end="url(#arrow-purple)"/>
  <path d="M 439 212 L 439 282" class="edge-mcp" marker-end="url(#arrow-purple)"/>
  <path d="M 706 212 L 706 282" class="edge-solid" marker-end="url(#arrow-blue)"/>

  <path d="M 171 380 L 171 452" class="edge-solid" marker-end="url(#arrow-blue)"/>
  <path d="M 439 380 L 439 452" class="edge-solid" marker-end="url(#arrow-blue)"/>
  <path d="M 706 380 L 706 452" class="edge-solid" marker-end="url(#arrow-blue)"/>

  <path d="M 171 542 L 171 612" class="edge-solid" marker-end="url(#arrow-blue)"/>
  <path d="M 439 542 L 195 612" class="edge-solid" marker-end="url(#arrow-blue)"/>
  <path d="M 439 542 L 680 612" class="edge-neo" marker-end="url(#arrow-green)"/>
  <path d="M 567 658 L 583 658" class="edge-async" marker-end="url(#arrow-amber)"/>

  
        <rect x="865" y="95" width="305" height="625" class="card-legacy"/>
        <rect x="881" y="110" width="165" height="20" rx="4" fill="#f87171"/>
        <text x="889" y="124" class="badge-text">OLD SVG / RETIRED CODE</text>
        <text x="881" y="150" class="node-title" fill="#fca5a5">기존 SVG에 잘못 남아있던 영역</text>
        <text x="881" y="170" class="node-desc">기존 backend-architecture.svg는 아래의</text>
        <text x="881" y="186" class="node-desc">퇴역한 Java 모듈만 그리고 있었습니다.</text>

        <rect x="881" y="205" width="273" height="110" class="card-neutral" stroke="#f87171"/>
        <text x="895" y="228" class="node-title">Java Spring Ingress (퇴역)</text>
        <text x="895" y="246" class="node-code">src/main/java/com/local/...</text>
        <text x="895" y="266" class="node-desc">• IngressController / IngestWorker</text>
        <text x="895" y="282" class="node-desc">• NatsIngestPublisher / Consumer</text>
        <text x="895" y="298" class="node-desc">• RetiredIndexBridgeTargetAdapter</text>

        <rect x="881" y="330" width="273" height="110" class="card-neutral" stroke="#f87171"/>
        <text x="895" y="353" class="node-title">CouchDB &amp; Qdrant 어댑터 (퇴역)</text>
        <text x="895" y="371" class="node-code">couchdb_source/ · dual_read_shadow.py</text>
        <text x="895" y="391" class="node-desc">• ADR-0003 PostgreSQL Cutover 완료</text>
        <text x="895" y="407" class="node-desc">• pyproject.toml에 qdrant-client 잔존</text>
        <text x="895" y="423" class="node-desc">• 제거 시 컨테이너/의존성 대폭 경량화</text>

        <rect x="881" y="455" width="273" height="245" class="card-warn"/>
        <text x="895" y="478" class="node-title">코드 레벨 리팩토링 포인트</text>
        <text x="895" y="502" class="node-desc">1. extraction_llm.py(Steward)와</text>
        <text x="895" y="518" class="node-desc">   graphiti_backend.py 간 엔티티 추출</text>
        <text x="895" y="534" class="node-desc">   프롬프트/LLM 호출 일원화</text>
        <text x="895" y="558" class="node-desc">2. hybrid_graph.py의 인메모리/폴백</text>
        <text x="895" y="574" class="node-desc">   그래프와 Neo4j Graphiti 쿼리 경계</text>
        <text x="895" y="590" class="node-desc">   명확화 (Neo4j = Read Projection)</text>
        <text x="895" y="614" class="node-desc">3. 루트 src/(Java) 폴더 및</text>
        <text x="895" y="630" class="node-desc">   build.gradle 아카이브/삭제</text>
        
</svg>